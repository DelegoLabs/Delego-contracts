[package]
name = "delego-marketplace"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
delego-reputation = { path = "../reputation", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
# Enables the legacy test suite (test.rs) which has pre-existing compile failures
# from bad merges. Gate it so normal `cargo test` only runs the healthy inline tests.
full_suite = []
