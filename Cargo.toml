[workspace]
members = [
    "delegation_registry",
    "escrow",
    "escrow/value_conservation_prop",
    "interfaces",
    "permissions",
    "reputation",
    "marketplace",
    "tests",
]
resolver = "2"

[workspace.dependencies]
soroban-sdk = "22.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
