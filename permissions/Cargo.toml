[package]
name = "delego-permissions"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]$soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
ed25519-dalek = "2"
# Property-based / fuzz-style generation for the spend & allowance-decrement
# invariant harness (issue #323). Pinned to the version already resolved
# transitively via soroban-sdk/stellar-xdr in Cargo.lock so no new major
# version enters the dependency graph.
arbitrary = { version = "1.3", features = ["derive"] }

[features]
testutils = ["soroban-sdk/testutils"]
