[package]
name = "delego-permissions"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "22.0.0" }

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
ed25519-dalek = "2"

[features]
testutils = ["soroban-sdk/testutils"]
# Enables the full (legacy) integration/test suites. These files are under
# active repair and do not currently compile; they are gated behind this
# feature so a normal `cargo test` runs the healthy inline test modules only.
full_suite = []

