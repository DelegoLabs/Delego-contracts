name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain-file: rust-toolchain.toml

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain-file: rust-toolchain.toml

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain-file: rust-toolchain.toml

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Run tests
        run: cargo test --workspace

      - name: Check Marketplace Version Consistency
        run: bash scripts/check_version.sh

  build:
    name: Build WASM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain-file: rust-toolchain.toml

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-wasm-${{ runner.os }}-

      - name: Build contracts
        run: cargo build --target wasm32-unknown-unknown --release

  audit:
    name: Supply-chain audit (cargo-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # cargo-audit reads Cargo.lock directly; no compilation needed, so we
      # skip the Rust toolchain / build cache setup to keep this job fast.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # --deny warnings promotes every advisory (including informational /
      # unmaintained) to a hard failure.  Exceptions require a documented entry
      # in audit.toml (see that file for the approval process).
      - name: Run cargo audit
        run: cargo audit --deny warnings --file audit.toml

  wasm-proof:
    name: WASM build proof (every contract crate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Run independently of the host-target build job so that WASM
    # build failures are reported as a distinct, clearly-labelled CI failure.

    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml already lists wasm32-unknown-unknown as a target,
      # so the toolchain action installs both the compiler and the WASM target
      # from the pinned channel in a single step.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain-file: rust-toolchain.toml

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-wasm-${{ runner.os }}-

      # Build every workspace crate that can target wasm32-unknown-unknown.
      # The `tests` crate is host-only (it uses std test-harness features and
      # has no [lib] section), so it is explicitly excluded.  All five contract
      # crates — delegation_registry, escrow, permissions, reputation, and
      # marketplace — are covered by this single command.
      - name: Build all contract crates for wasm32-unknown-unknown (release)
        run: |
          set -euo pipefail
          cargo build --release --target wasm32-unknown-unknown \
            --package delego-delegation-registry \
            --package delego-escrow \
            --package delego-permissions \
            --package delego-reputation \
            --package delego-marketplace

      # Confirm that a .wasm artifact was produced for every contract crate.
      # This step fails CI if the build silently skipped any package.
      - name: Verify WASM artifacts were produced for all five contract crates
        run: |
          set -euo pipefail
          RELEASE_DIR="target/wasm32-unknown-unknown/release"
          EXPECTED=(
            delego_delegation_registry.wasm
            delego_escrow.wasm
            delego_permissions.wasm
            delego_reputation.wasm
            delego_marketplace.wasm
          )
          missing=()
          for artifact in "${EXPECTED[@]}"; do
            if [ ! -f "${RELEASE_DIR}/${artifact}" ]; then
              missing+=("${artifact}")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing WASM artifacts: ${missing[*]}"
            exit 1
          fi
          echo "All contract WASM artifacts present:"
          ls -lh "${RELEASE_DIR}"/*.wasm
