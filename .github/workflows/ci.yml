name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain-file: rust-toolchain.toml

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain-file: rust-toolchain.toml

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain-file: rust-toolchain.toml

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Run tests
        run: cargo test --workspace

      - name: Check Marketplace Version Consistency
        run: bash scripts/check_version.sh

  build:
    name: Build WASM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain-file: rust-toolchain.toml

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-wasm-${{ runner.os }}-

      - name: Build contracts
        run: cargo build --target wasm32-unknown-unknown --release

  audit:
    name: Supply-chain audit (cargo-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # cargo-audit reads Cargo.lock directly; no compilation needed, so we
      # skip the Rust toolchain / build cache setup to keep this job fast.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # --deny warnings promotes every advisory (including informational /
      # unmaintained) to a hard failure.  Exceptions require a documented entry
      # in audit.toml (see that file for the approval process).
      - name: Run cargo audit
        run: cargo audit --deny warnings --file audit.toml

  wasm-proof:
    name: WASM build proof (every crate)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-wasm-${{ runner.os }}-

      - name: Build every workspace crate for wasm32-unknown-unknown (release)
        run: |
          cargo build --release --workspace --target wasm32-unknown-unknown

      - name: Verify WASM artifacts were produced
        run: |
          set -euo pipefail
          echo "WASM artifacts produced:"
          find target/wasm32-unknown-unknown/release -maxdepth 1 -name '*.wasm' -print
          count=$(find target/wasm32-unknown-unknown/release -maxdepth 1 -name '*.wasm' | wc -l)
          if [ "$count" -lt 5 ]; then
            echo "::error::Expected at least 5 .wasm artifacts (one per contract crate), found $count"
            exit 1
          fi
      - name: Build every workspace member for WASM
          for package in $(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print("\\n".join(package["name"] for package in json.load(sys.stdin)["packages"]))'); do
            echo "Building ${package}"
            cargo build --package "${package}" --target wasm32-unknown-unknown --release
          done
