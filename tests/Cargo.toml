[package]
name = "delego-cross-contract-tests"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
soroban-sdk = { workspace = true }
delego-escrow = { path = "../escrow" }
delego-permissions = { path = "../permissions" }
delego-reputation = { path = "../reputation" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
delego-escrow = { path = "../escrow", features = ["testutils"] }
delego-permissions = { path = "../permissions", features = ["testutils"] }
delego-reputation = { path = "../reputation", features = ["testutils"] }
ed25519-dalek = "2"

[[test]]
name = "cross_contract"
path = "cross_contract.rs"

[[test]]
name = "no_std_consistency"
path = "no_std_consistency.rs"

