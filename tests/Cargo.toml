[package]
name = "delego-tests"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
soroban-sdk = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
delego-escrow = { path = "../escrow", features = ["testutils"] }
delego-interfaces = { path = "../interfaces", features = ["testutils"] }
delego-permissions = { path = "../permissions", features = ["testutils"] }
delego-reputation = { path = "../reputation", features = ["testutils"] }
delego-delegation-registry = { path = "../delegation_registry", features = ["testutils"] }
delego-marketplace = { path = "../marketplace", features = ["testutils"] }
ed25519-dalek = "2"
# Property-based generation for the reentrancy fuzz suite (issue #400).
# Pinned to the version already resolved transitively via soroban-sdk/stellar-xdr.
arbitrary = { version = "1.3", features = ["derive"] }
proptest = "1.11.0"

[[test]]
name = "cross_contract"
path = "src/cross_contract.rs"

[[test]]
name = "reentrancy_fuzz"
path = "reentrancy_fuzz.rs"

[[test]]
name = "lending_pool"
path = "src/lending_pool.rs"

[[test]]
name = "no_std_consistency"
path = "src/no_std_consistency.rs"
path = "no_std_consistency.rs"

[[test]]
name = "gas_benchmark"
path = "gas_benchmark.rs"
