[package]
name = "delego-cross-contract-tests"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
soroban-sdk = { workspace = true }
delego-escrow = { path = "../escrow" }
delego-interfaces = { path = "../interfaces" }
delego-permissions = { path = "../permissions" }
delego-reputation = { path = "../reputation" }
delego-delegation-registry = { path = "../delegation_registry" }
delego-marketplace = { path = "../marketplace" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
delego-escrow = { path = "../escrow", features = ["testutils"] }
delego-interfaces = { path = "../interfaces", features = ["testutils"] }
delego-permissions = { path = "../permissions", features = ["testutils"] }
delego-reputation = { path = "../reputation", features = ["testutils"] }
delego-delegation-registry = { path = "../delegation_registry", features = ["testutils"] }
delego-marketplace = { path = "../marketplace", features = ["testutils"] }
ed25519-dalek = "2"

[[test]]
name = "cross_contract"
path = "cross_contract.rs"

[[test]]
name = "lending_pool"
path = "lending_pool.rs"

[[test]]
name = "no_std_consistency"
path = "no_std_consistency.rs"
